services:
  db:
    image: postgres:15-alpine
    container_name: spring-street-db
    environment:
      POSTGRES_USER: springstreet
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: prisma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata:
